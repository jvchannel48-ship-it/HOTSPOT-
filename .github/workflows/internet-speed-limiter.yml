name: Internet Speed Limiter APK Build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.9 directly (no wrapper/cache action)
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.9/bin >> "$GITHUB_PATH"
      - name: Build APK
        run: gradle -p speed-limiter assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: internet-speed-limiter-debug-apk
          path: speed-limiter/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
