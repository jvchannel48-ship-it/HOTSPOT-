name: Internet Speed Limiter APK Build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/gradle-build-action@v3
        with:
          arguments: -p speed-limiter assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: internet-speed-limiter-debug-apk
          path: speed-limiter/app/build/outputs/apk/debug/*.apk
