<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0c13"><title>CINE-KO · Home of Movies & Series</title>
<style>
:root{color-scheme:dark;--bg:#0a0c13;--panel:#191d29;--muted:#a6aebf;--red:#e51f43}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px system-ui,Arial}header{position:sticky;top:0;background:#0a0c13ee;backdrop-filter:blur(12px);padding:16px max(18px,calc((100% - 1100px)/2));z-index:5;border-bottom:1px solid #252a38}.brand{font-size:25px;font-weight:900}.brand span{color:var(--red)}.search{display:flex;gap:8px;margin-top:12px}input{min-width:0;flex:1;background:var(--panel);border:1px solid #303748;border-radius:12px;padding:13px;color:white;font-size:16px}button{border:0;border-radius:11px;background:var(--red);color:white;font-weight:700;padding:11px 15px;cursor:pointer}.tabs{display:flex;gap:8px;overflow:auto;padding:12px max(18px,calc((100% - 1100px)/2));border-bottom:1px solid #252a38}.tabs button{background:var(--panel);white-space:nowrap}.tabs button.active{background:var(--red)}main{max-width:1100px;margin:auto;padding:12px 18px 50px}.section{margin:22px 0}.section h2{font-size:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:14px}.movie{background:var(--panel);border-radius:12px;overflow:hidden;cursor:pointer}.movie img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#252a38}.movie strong{display:block;padding:9px;font-size:13px}.muted{color:var(--muted)}.row{display:flex;gap:12px;overflow:auto}.row .movie{min-width:135px;width:135px}.detail{display:grid;grid-template-columns:150px 1fr;gap:18px}.detail img{width:100%;border-radius:12px}.episode{display:block;width:100%;text-align:left;margin:8px 0;background:var(--panel)}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}.status{padding:18px;color:var(--muted)}@media(max-width:520px){.detail{grid-template-columns:100px 1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<header><div class="brand">CINE<span>-KO</span></div><div class="muted">Your home of movies & series</div><form class="search" id="searchForm"><input id="q" placeholder="Search movies and series…" autocomplete="off"><button>Search</button></form></header>
<nav class="tabs"><button class="active" data-tab="Home">Home</button><button data-tab="Movies">Movies</button><button data-tab="Series">Series</button><button data-tab="My List">My List</button></nav>
<main id="app"><p class="status">Loading CINE-KO…</p></main>
<script>
const API='/api/tmdb/3', IMG='https://image.tmdb.org/t/p/w500';let tab='Home',saved=JSON.parse(localStorage.getItem('cineko-list')||'[]'),currentShow=null;
async function api(path){const r=await fetch(API+path);const j=await r.json();if(!r.ok)throw Error(j.error||j.status_message||'Catalog request failed');return j}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text)n.textContent=text;return n}
function setTab(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(t==='Home')home();if(t==='Movies')listing('movie','/movie/popular');if(t==='Series')listing('tv','/tv/popular');if(t==='My List')showSaved()}
function card(item,type){const d=el('article','movie'),im=el('img');im.loading='lazy';im.src=item.poster_path?IMG+item.poster_path:'';im.alt=item.title||item.name||'Poster';d.append(im,el('strong','',item.title||item.name||'Untitled'));d.onclick=()=>details(item,type);return d}
function grid(items,type){const g=el('div','grid');(items||[]).filter(x=>x.poster_path).forEach(x=>g.append(card(x,type)));return g}
function section(title,items,type){const s=el('section','section');s.append(el('h2','',title),grid(items,type));return s}
async function home(){const a=document.getElementById('app');a.replaceChildren(el('p','status','Loading popular titles…'));try{const [m,t]=await Promise.all([api('/trending/movie/week'),api('/tv/popular')]);a.replaceChildren(section('Trending Movies',m.results,'movie'),section('Popular Series',t.results,'tv'))}catch(e){a.replaceChildren(el('p','status',e.message+' — check Render environment variable TMDB_API_TOKEN.'))}}
async function listing(type,path){const a=document.getElementById('app');a.replaceChildren(el('p','status','Loading…'));try{const d=await api(path);a.replaceChildren(section(type==='movie'?'Popular Movies':'Popular Series',d.results,type))}catch(e){a.replaceChildren(el('p','status',e.message))}}
async function search(q){tab='Search';document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));const a=document.getElementById('app');a.replaceChildren(el('p','status','Searching…'));try{const d=await api('/search/multi?query='+encodeURIComponent(q));a.replaceChildren(el('h2','','Search results: '+q),grid((d.results||[]).filter(x=>x.media_type==='movie'||x.media_type==='tv'),null));a.querySelectorAll('.movie').forEach((c,i)=>{const item=(d.results||[]).filter(x=>x.media_type==='movie'||x.media_type==='tv')[i];c.onclick=()=>details(item,item.media_type)})}catch(e){a.replaceChildren(el('p','status',e.message))}}
async function details(item,type){currentShow={...item,type};const a=document.getElementById('app');a.replaceChildren(el('p','status','Loading details…'));try{const d=await api('/'+type+'/'+item.id+'?append_to_response=videos');a.replaceChildren();const box=el('section','section detail');const im=el('img');im.src=item.poster_path?IMG+item.poster_path:'';const info=el('div');info.append(el('h2','',d.title||d.name||'Details'),el('p','muted',d.overview||'No description available.'));const save=el('button','',saved.some(x=>x.id===item.id)?'In My List':'＋ My List');save.onclick=()=>{if(!saved.some(x=>x.id===item.id))saved.push({...item,media_type:type});localStorage.setItem('cineko-list',JSON.stringify(saved));save.textContent='In My List'};info.append(save);box.append(im,info);a.append(box);
const vids=d.videos?.results||[],trailer=vids.find(v=>v.site==='YouTube'&&(v.type==='Trailer'||v.type==='Teaser'));if(trailer){const sec=el('section','section');sec.append(el('h2','','Official Trailer'));const frame=document.createElement('iframe');frame.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(trailer.key);frame.allow='accelerometer; autoplay; encrypted-media; picture-in-picture';frame.allowFullscreen=true;sec.append(frame);a.append(sec)}
if(type==='tv'){const h=el('h2','section','Seasons & Episodes');a.append(h);for(const season of d.seasons||[]){if(!season.season_number)continue;const b=el('button','episode','Season '+season.season_number+' · '+season.episode_count+' episodes');b.onclick=()=>episodes(item.id,season.season_number);a.append(b)}}}catch(e){a.replaceChildren(el('p','status',e.message))}}
async function episodes(id,n){const a=document.getElementById('app');a.replaceChildren(el('p','status','Loading episodes…'));try{const d=await api('/tv/'+id+'/season/'+n);a.replaceChildren(el('h2','','Season '+n));(d.episodes||[]).forEach(ep=>{const b=el('button','episode','Episode '+ep.episode_number+' · '+ep.name);b.onclick=()=>{a.replaceChildren(el('h2','',ep.name||'Episode'),el('p','muted','TMDB lists episode information, not full episode streams. Use a licensed streaming service for the complete episode.'))};a.append(b)})}catch(e){a.replaceChildren(el('p','status',e.message))}}
function showSaved(){const a=document.getElementById('app');a.replaceChildren(el('h2','','My List'));if(!saved.length){a.append(el('p','status','Your list is empty.'));return}a.append(grid(saved,saved[0].media_type||'movie'))}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();const q=document.getElementById('q').value.trim();if(q)search(q)};home();
</script></body></html>
