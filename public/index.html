<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0c13"><title>CINE-KO · Home of Movies & Series</title>
<style>
:root{color-scheme:dark;--bg:#0a0c13;--panel:#191d29;--muted:#a6aebf;--red:#e51f43}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px system-ui,Arial}header{position:sticky;top:0;background:#0a0c13ee;backdrop-filter:blur(12px);padding:16px max(18px,calc((100% - 1100px)/2));z-index:5;border-bottom:1px solid #252a38}.brand{font-size:25px;font-weight:900}.brand span{color:var(--red)}.search{display:flex;gap:8px;margin-top:12px}input{min-width:0;flex:1;background:var(--panel);border:1px solid #303748;border-radius:12px;padding:13px;color:white;font-size:16px}button{border:0;border-radius:11px;background:var(--red);color:white;font-weight:700;padding:11px 15px;cursor:pointer}.tabs{display:flex;gap:8px;overflow:auto;padding:12px max(18px,calc((100% - 1100px)/2));border-bottom:1px solid #252a38}.tabs button{background:var(--panel);white-space:nowrap}.tabs button.active{background:var(--red)}main{max-width:1100px;margin:auto;padding:12px 18px 50px}.section{margin:22px 0}.section h2{font-size:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:14px}.movie{background:var(--panel);border-radius:12px;overflow:hidden;cursor:pointer}.movie img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#252a38}.movie strong{display:block;padding:9px;font-size:13px}.muted{color:var(--muted)}.row{display:flex;gap:12px;overflow:auto}.row .movie{min-width:135px;width:135px}.detail{display:grid;grid-template-columns:150px 1fr;gap:18px}.detail img{width:100%;border-radius:12px}.episode{display:block;width:100%;text-align:left;margin:8px 0;background:var(--panel)}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}.status{padding:18px;color:var(--muted)}@media(max-width:520px){.detail{grid-template-columns:100px 1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<header><div class="brand">CINE<span>-KO</span></div><div class="muted">Your home of movies & series</div><form class="search" id="searchForm"><input id="q" placeholder="Search movies and series…" autocomplete="off"><button>Search</button></form></header>
<nav class="tabs"><button class="active" data-tab="Home">Home</button><button data-tab="Movies">Movies</button><button data-tab="Series">Series</button><button data-tab="Videos">Videos</button><button data-tab="My List">My List</button></nav>
<main id="app"><p class="status">Loading CINE-KO…</p></main>
<script>
const API='/api/cinemeta',IMG='';let tab='Home',saved=JSON.parse(localStorage.getItem('cineko-list')||'[]');
async function api(path){const r=await fetch(API+path);const j=await r.json();if(!r.ok)throw Error(j.error||'Public catalog is unavailable');return j}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text)n.textContent=text;return n}
function title(x){return x.name||x.title||'Untitled'}
function poster(x){return x.poster||x.background||''}
function setTab(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(t==='Home')home();if(t==='Movies')listing('movie');if(t==='Series')listing('series');if(t==='Videos')videoSearch();if(t==='My List')showSaved()}
function card(item,type){const d=el('article','movie'),im=el('img');im.loading='lazy';im.src=poster(item);im.alt=title(item);d.append(im,el('strong','',title(item)));d.onclick=()=>details(item,type||item.type||'movie');return d}
function grid(items,type){const g=el('div','grid');(items||[]).filter(x=>poster(x)).forEach(x=>g.append(card(x,type)));return g}
function section(t,items,type){const s=el('section','section');s.append(el('h2','',t),grid(items,type));return s}
async function catalog(type,query=''){const q=query?'/search='+encodeURIComponent(query):'';return api('/catalog/'+type+'/top'+q+'.json')}
async function home(){const a=document.getElementById('app');a.replaceChildren(el('p','status','Loading free public movie catalog…'));try{const [m,t]=await Promise.all([catalog('movie'),catalog('series')]);a.replaceChildren(section('Popular Movies',m.metas||[],'movie'),section('Popular Series',t.metas||[],'series'))}catch(e){a.replaceChildren(el('p','status',e.message+' Please refresh in a moment.'))}}
async function listing(type){const a=document.getElementById('app');a.replaceChildren(el('p','status','Loading…'));try{const d=await catalog(type);a.replaceChildren(section(type==='movie'?'Popular Movies':'Popular Series',d.metas||[],type))}catch(e){a.replaceChildren(el('p','status',e.message))}}
async function search(q){const a=document.getElementById('app');a.replaceChildren(el('p','status','Searching…'));try{const [m,t]=await Promise.all([catalog('movie',q),catalog('series',q)]);a.replaceChildren(el('h2','','Search results: '+q),section('Movies',m.metas||[],'movie'),section('Series',t.metas||[],'series'))}catch(e){a.replaceChildren(el('p','status',e.message))}}
async function details(item,type){const a=document.getElementById('app');a.replaceChildren(el('p','status','Loading details…'));try{const d=(await api('/meta/'+(type==='series'?'series':'movie')+'/'+encodeURIComponent(item.id)+'.json')).meta;if(!d)throw Error('No details found');a.replaceChildren();const box=el('section','section detail'),im=el('img');im.src=poster(d)||poster(item);const info=el('div');info.append(el('h2','',title(d)),el('p','muted',d.description||'No description available.'),el('p','muted',[d.releaseInfo,d.imdbRating?'IMDb '+d.imdbRating:'',...(d.genres||[])].filter(Boolean).join(' · ')));const save=el('button','',saved.some(x=>x.id===item.id)?'In My List':'＋ My List');save.onclick=()=>{if(!saved.some(x=>x.id===item.id))saved.push({...item,type});localStorage.setItem('cineko-list',JSON.stringify(saved));save.textContent='In My List'};info.append(save);box.append(im,info);a.append(box);
if(type==='series'){const eps=(d.videos||[]).slice().sort((x,y)=>(x.season-y.season)||(x.number-y.number));const h=el('h2','section','Seasons & Episodes');a.append(h);let last=-1;eps.forEach(ep=>{if(ep.season!==last){last=ep.season;a.append(el('h3','','Season '+last))}const b=el('button','episode','Episode '+ep.number+' · '+ep.title+(ep.released?' · '+ep.released.slice(0,10):''));b.onclick=()=>{a.querySelectorAll('.episode').forEach(x=>x.classList.remove('active'));b.classList.add('active');const note=el('p','muted','Episode information only. Full video playback requires an authorized streaming source.');const old=a.querySelector('.episode-note');if(old)old.remove();note.className='episode-note muted';b.after(note)};a.append(b)});if(!eps.length)a.append(el('p','muted','No episode guide available for this series.'))}
}catch(e){a.replaceChildren(el('p','status',e.message))}}

async function videoSearch(q='feature film'){
 const a=document.getElementById('app');a.replaceChildren(el('h2','','Free licensed videos'),el('p','muted','Public-domain and Creative Commons videos from Internet Archive. Availability and rights vary by item.'));
 const form=el('form','search'),input=el('input');input.placeholder='Search public-domain movies…';input.value=q;const btn=el('button','','Search videos');form.append(input,btn);form.onsubmit=e=>{e.preventDefault();videoSearch(input.value.trim()||'feature film')};a.append(form);
 const results=el('div','grid');a.append(results,el('p','status','Loading video catalog…'));
 try{const r=await fetch('/api/videos/search?q='+encodeURIComponent(q));const data=await r.json();if(!r.ok)throw Error(data.error||'Video search failed');a.querySelector('.status')?.remove();if(!data.results.length){a.append(el('p','status','No matching items found. Try another search.'));return}
 data.results.forEach(item=>{const c=el('article','movie');c.append(el('strong','',item.title),el('p','muted',String(item.year||'')+' · Internet Archive'));c.onclick=()=>playArchiveVideo(item);results.append(c)})
 }catch(e){a.append(el('p','status',e.message))}
}
async function playArchiveVideo(item){
 const a=document.getElementById('app');a.replaceChildren(el('p','status','Checking license and video file…'));
 try{const r=await fetch('/api/videos/'+encodeURIComponent(item.id));const d=await r.json();if(!r.ok)throw Error(d.error||'Video unavailable');
 a.replaceChildren(el('h2','',d.title));const player=document.createElement('video');player.controls=true;player.playsInline=true;player.preload='metadata';player.src=d.videoUrl;player.style.width='100%';player.style.maxHeight='70vh';player.style.background='#000';a.append(player,el('p','muted','Source: Internet Archive · '+d.format+' · Declared license: '+d.license),el('p','muted','If playback does not start, this file may not be supported by your browser or may be temporarily unavailable.'));
 const back=el('button','','Back to video results');back.onclick=()=>videoSearch();a.append(back);
 }catch(e){a.replaceChildren(el('p','status',e.message));const back=el('button','','Back to videos');back.onclick=()=>videoSearch();a.append(back)}
}

function showSaved(){const a=document.getElementById('app');a.replaceChildren(el('h2','','My List'));if(!saved.length){a.append(el('p','status','Your list is empty.'));return}a.append(grid(saved,null))}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();const q=document.getElementById('q').value.trim();if(q)search(q)};home();
</script></body></html>
